<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f7f8fa"/>
  <text x="72" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Relapse is an entry layer, not the whole ecosystem</text>
  <text x="72" y="108" font-family="Arial, sans-serif" font-size="18" fill="#586174">One exploit chain can unlock many independent projects without creating them.</text>

  <rect x="72" y="158" width="280" height="110" rx="8" fill="#101828"/>
  <text x="96" y="198" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Relapse</text>
  <text x="96" y="229" font-family="Arial, sans-serif" font-size="17" fill="#cbd5e1">Browser + kernel exploit chain</text>
  <text x="96" y="252" font-family="Arial, sans-serif" font-size="17" fill="#cbd5e1">Firmware 7.00-13.60</text>

  <path d="M352 213 H430" stroke="#697386" stroke-width="4"/>
  <path d="M418 203 L432 213 L418 223" fill="none" stroke="#697386" stroke-width="4"/>

