  <text x="456" y="229" font-family="Arial, sans-serif" font-size="17" fill="#ccfbf1">ELF loading capability</text>
  <text x="456" y="252" font-family="Arial, sans-serif" font-size="17" fill="#ccfbf1">Unstable; retries or panic possible</text>

