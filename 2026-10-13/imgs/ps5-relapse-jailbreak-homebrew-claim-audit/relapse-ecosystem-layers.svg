  <text x="624" y="447" font-family="Arial, sans-serif" font-size="16" fill="#166534">4K output is documented</text>

  <rect x="864" y="348" width="264" height="128" rx="8" fill="#ffffff" stroke="#b7c0cf" stroke-width="2"/>
