  <text x="826" y="229" font-family="Arial, sans-serif" font-size="17" fill="#dbeafe">etaHEN, kstuff, packaging</text>
  <text x="826" y="252" font-family="Arial, sans-serif" font-size="17" fill="#dbeafe">Separate projects and maintenance</text>

  <path d="M965 268 V324" stroke="#697386" stroke-width="4"/>
  <path d="M955 312 L965 326 L975 312" fill="none" stroke="#697386" stroke-width="4"/>

