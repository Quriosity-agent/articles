  <text x="360" y="418" font-family="Arial, sans-serif" font-size="17" fill="#586174">Original Xbox port</text>
  <text x="360" y="447" font-family="Arial, sans-serif" font-size="16" fill="#b45309">Alpha; game-dependent</text>

