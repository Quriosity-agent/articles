<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Evidence ladder for evaluating an AI animation claim</title>
  <desc id="desc">Four evidence layers separate viral attribution, official model records, repository artifacts, and independent execution.</desc>
  <style>.h1{font:700 44px Inter,Arial,sans-serif;fill:#171a1f}.sub{font:400 21px Inter,Arial,sans-serif;fill:#606b78}.t{font:700 24px Inter,Arial,sans-serif;fill:#171a1f}.c{font:400 18px Inter,Arial,sans-serif;fill:#46505c}.k{font:700 17px Inter,Arial,sans-serif;fill:#fff}</style>
  <rect width="1600" height="900" fill="#f5f7f8"/>
  <text x="80" y="90" class="h1">Do not collapse four different kinds of evidence</text>
  <text x="80" y="130" class="sub">Each higher layer is stronger, but usually proves a narrower claim.</text>

  <rect x="140" y="650" width="1320" height="130" rx="8" fill="#fff" stroke="#d94b3d" stroke-width="3"/>
  <rect x="140" y="650" width="190" height="130" rx="8" fill="#d94b3d"/><text x="190" y="723" class="k">VIRAL CLAIM</text>
  <text x="370" y="702" class="t">“This was made by Fable 5.5”</text><text x="370" y="742" class="c">Useful as a lead; weak as model provenance.</text>

  <rect x="260" y="490" width="1200" height="130" rx="8" fill="#fff" stroke="#d99a25" stroke-width="3"/>
  <rect x="260" y="490" width="190" height="130" rx="8" fill="#d99a25"/><text x="301" y="563" class="k">OFFICIAL RECORD</text>
  <text x="490" y="542" class="t">Model pages, newsroom, system cards</text><text x="490" y="582" class="c">Can confirm a release exists; cannot reproduce the artwork.</text>

  <rect x="380" y="330" width="1080" height="130" rx="8" fill="#fff" stroke="#3d67a5" stroke-width="3"/>
  <rect x="380" y="330" width="190" height="130" rx="8" fill="#3d67a5"/><text x="420" y="403" class="k">PUBLIC ARTIFACT</text>
  <text x="610" y="382" class="t">Scripts, scenes, specs, tests, licenses</text><text x="610" y="422" class="c">Can prove implementation scope and expose missing deliverables.</text>

  <rect x="500" y="170" width="960" height="130" rx="8" fill="#fff" stroke="#2b8978" stroke-width="3"/>
  <rect x="500" y="170" width="190" height="130" rx="8" fill="#2b8978"/><text x="528" y="243" class="k">INDEPENDENT RUN</text>
  <text x="730" y="222" class="t">Tests, rendering, decode, and QA</text><text x="730" y="262" class="c">Strong behavioral evidence, limited to the exact paths exercised.</text>

  <text x="1030" y="845" class="sub">Attribution ≠ implementation ≠ execution ≠ artistic acceptance</text>
</svg>
