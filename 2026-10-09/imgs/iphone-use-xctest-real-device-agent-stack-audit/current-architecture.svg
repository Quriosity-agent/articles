<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">iphone-use current architecture</title>
  <desc id="desc">Agents, browser and iOS remote connect to a Rust daemon on the Mac. The daemon talks through loopback relays to a custom XCTest runner on a real iPhone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#131925"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#68a7ff"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #f7f9fc; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #9fa9ba; }
      .heading { font: 650 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #f7f9fc; }
      .body { font: 400 21px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #c8d0dd; }
      .small { font: 500 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #95a2b5; }
      .tag { font: 650 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #7cc4ff; }
      .box { fill: #171f2d; stroke: #3f4d63; stroke-width: 2; rx: 12; }
      .accent { fill: #132a46; stroke: #4a9cff; stroke-width: 3; rx: 12; }
      .phone { fill: #161b25; stroke: #62d6a6; stroke-width: 3; rx: 28; }
      .line { fill: none; stroke: #68a7ff; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="90" class="title">iphone-use: current control path</text>
  <text x="90" y="132" class="subtitle">Custom XCTest runner, not macOS iPhone Mirroring</text>

  <rect x="90" y="225" width="270" height="115" class="box"/>
  <text x="125" y="268" class="heading">AI agent</text>
  <text x="125" y="306" class="body">MCP: 26 tools</text>
  <rect x="90" y="390" width="270" height="115" class="box"/>
  <text x="125" y="433" class="heading">Browser</text>
  <text x="125" y="471" class="body">Live view + control</text>
  <rect x="90" y="555" width="270" height="115" class="box"/>
  <text x="125" y="598" class="heading">iOS remote</text>
  <text x="125" y="636" class="body">Pairing + multi-phone</text>

  <path d="M360 282H505" class="line"/>
  <path d="M360 447H505" class="line"/>
  <path d="M360 612H505" class="line"/>

  <rect x="515" y="190" width="405" height="515" class="accent"/>
  <text x="555" y="245" class="heading">Rust daemon on macOS</text>
  <text x="555" y="280" class="small">Default: 127.0.0.1:44321</text>
  <rect x="555" y="320" width="325" height="70" class="box"/>
  <text x="580" y="363" class="body">HTTP /agent/* + auth</text>
  <rect x="555" y="410" width="325" height="70" class="box"/>
  <text x="580" y="453" class="body">Owner lease + action policy</text>
  <rect x="555" y="500" width="325" height="70" class="box"/>
  <text x="580" y="543" class="body">Settle + delta + retry verdict</text>
  <rect x="555" y="590" width="325" height="70" class="box"/>
  <text x="580" y="633" class="body">Flows, tests, schedules</text>

  <path d="M920 362H1080" class="line"/>
  <path d="M920 540H1080" class="line"/>
  <text x="952" y="337" class="tag">control :8100</text>
  <text x="954" y="515" class="tag">video :9100</text>

  <rect x="1090" y="190" width="410" height="515" class="phone"/>
  <rect x="1240" y="210" width="110" height="14" rx="7" fill="#536174"/>
  <text x="1135" y="285" class="heading">Real iPhone</text>
  <text x="1135" y="320" class="small">Developer Mode + signed runner</text>
  <rect x="1135" y="360" width="320" height="85" class="box"/>
  <text x="1165" y="397" class="body">Custom XCTest runner</text>
  <text x="1165" y="425" class="small">WDA-compatible API</text>
  <rect x="1135" y="475" width="320" height="75" class="box"/>
  <text x="1165" y="520" class="body">Accessibility snapshot</text>
  <rect x="1135" y="580" width="320" height="75" class="box"/>
  <text x="1165" y="625" class="body">Synthetic touch + H.264</text>

  <rect x="90" y="760" width="1410" height="70" rx="10" fill="#101621" stroke="#2f3b4d" stroke-width="2"/>
  <text x="125" y="803" class="body">Trust boundary: daemon authentication does not protect the runner's unauthenticated phone-side ports. Use USB or a trusted, isolated network.</text>
</svg>
