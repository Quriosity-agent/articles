<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Provider-neutral architecture boundary</title>
  <desc id="desc">The repository provides a production protocol and local verification, while external capabilities create voice, presenter motion, and lip sync.</desc>
  <rect width="1600" height="900" fill="#f6f7f8"/>
  <text x="90" y="105" fill="#18222a" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">Provider-neutral means orchestration, not a bundled presenter model</text>
  <text x="90" y="151" fill="#5a6670" font-family="Arial, Helvetica, sans-serif" font-size="23">The repository defines what must happen and what must be proven. Other tools create the costly media.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="90" y="225" width="420" height="480" rx="12" fill="#fff" stroke="#65a98e" stroke-width="3"/><rect x="90" y="225" width="420" height="82" rx="12" fill="#dff0e9"/><rect x="90" y="289" width="420" height="18" fill="#dff0e9"/><text x="125" y="277" fill="#155b49" font-size="26" font-weight="700">IN THIS REPOSITORY</text><text x="128" y="363" fill="#24372f" font-size="21" font-weight="700">Production protocol</text><text x="128" y="405" fill="#4b5e55" font-size="19">job.json capability slots</text><text x="128" y="441" fill="#4b5e55" font-size="19">state machine and approvals</text><text x="128" y="477" fill="#4b5e55" font-size="19">pause-aware segment planner</text><text x="128" y="513" fill="#4b5e55" font-size="19">FFmpeg delivery finalizer</text><text x="128" y="549" fill="#4b5e55" font-size="19">preflight and smoke tests</text><line x1="128" y1="591" x2="472" y2="591" stroke="#cbd7d1"/><text x="128" y="635" fill="#155b49" font-size="20" font-weight="700">Owns rules, records, and evidence</text>
    <rect x="590" y="225" width="420" height="480" rx="12" fill="#fff" stroke="#6c9bc1" stroke-width="3"/><rect x="590" y="225" width="420" height="82" rx="12" fill="#e4eef6"/><rect x="590" y="289" width="420" height="18" fill="#e4eef6"/><text x="625" y="277" fill="#215f8c" font-size="26" font-weight="700">AGENT / HARNESS</text><text x="628" y="363" fill="#2c3b47" font-size="21" font-weight="700">Capability router</text><text x="628" y="405" fill="#556570" font-size="19">chooses installed tools</text><text x="628" y="441" fill="#556570" font-size="19">fills provider metadata</text><text x="628" y="477" fill="#556570" font-size="19">runs pilot and polls tasks</text><text x="628" y="513" fill="#556570" font-size="19">reviews visual candidates</text><text x="628" y="549" fill="#556570" font-size="19">resumes from saved state</text><line x1="628" y1="591" x2="972" y2="591" stroke="#ced8df"/><text x="628" y="635" fill="#215f8c" font-size="20" font-weight="700">Connects protocol to real tools</text>
    <rect x="1090" y="225" width="420" height="480" rx="12" fill="#fff" stroke="#cc8b60" stroke-width="3"/><rect x="1090" y="225" width="420" height="82" rx="12" fill="#f5e9e0"/><rect x="1090" y="289" width="420" height="18" fill="#f5e9e0"/><text x="1125" y="277" fill="#8b4824" font-size="26" font-weight="700">EXTERNAL CAPABILITIES</text><text x="1128" y="363" fill="#46362e" font-size="21" font-weight="700">Media generation</text><text x="1128" y="405" fill="#6b5a50" font-size="19">voice / TTS provider</text><text x="1128" y="441" fill="#6b5a50" font-size="19">presenter video provider</text><text x="1128" y="477" fill="#6b5a50" font-size="19">lip-sync repair</text><text x="1128" y="513" fill="#6b5a50" font-size="19">ASR and compositor</text><text x="1128" y="549" fill="#6b5a50" font-size="19">provider credentials</text><line x1="1128" y1="591" x2="1472" y2="591" stroke="#ded2ca"/><text x="1128" y="635" fill="#8b4824" font-size="20" font-weight="700">Owns synthesis and billing</text>
    <path d="M520 456 L568 456" stroke="#53626c" stroke-width="4"/><path d="M558 444 L574 456 L558 468" fill="none" stroke="#53626c" stroke-width="4"/><path d="M1020 456 L1068 456" stroke="#53626c" stroke-width="4"/><path d="M1058 444 L1074 456 L1058 468" fill="none" stroke="#53626c" stroke-width="4"/>
    <rect x="300" y="760" width="1000" height="76" rx="10" fill="#242d33"/><text x="800" y="808" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Portable workflow: yes. Standalone digital-human generator: no.</text>
  </g>
</svg>
